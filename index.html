<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>Teplo Drinks · Продажи</title>
<style>
/* ============================================================
   НАСТРОЙКА: вставьте ссылку на ваш Google Apps Script ниже
   в блоке <script> → const SCRIPT_URL = "..."
   ============================================================ */

:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --card-2:#FFFFFF;
  --label:#000000;
  --label-2:rgba(60,60,67,.60);
  --label-3:rgba(60,60,67,.30);
  --sep:rgba(60,60,67,.14);
  --blue:#007AFF;
  --green:#34C759;
  --red:#FF3B30;
  --orange:#FF9500;
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.16);
  --blur:rgba(242,242,247,.82);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --r-card:20px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --card:#1C1C1E;
    --card-2:#2C2C2E;
    --label:#FFFFFF;
    --label-2:rgba(235,235,245,.60);
    --label-3:rgba(235,235,245,.30);
    --sep:rgba(84,84,88,.65);
    --fill:rgba(120,120,128,.24);
    --fill-2:rgba(120,120,128,.32);
    --blur:rgba(0,0,0,.72);
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  font-size:17px;
  line-height:1.29;
  letter-spacing:-.022em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(24px + var(--safe-b));
  overflow-x:hidden;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;}

/* ---------- Шапка ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(10px + var(--safe-t)) 20px 10px;
  background:var(--blur);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.topbar h1{
  margin:0;font-size:22px;font-weight:700;letter-spacing:-.026em;
  font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,sans-serif;
}
.status{
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:590;color:var(--label-2);
  background:var(--fill);border-radius:100px;padding:6px 11px;
  letter-spacing:-.01em;white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;}
.status.pending .dot{background:var(--orange);animation:pulse 1.4s ease-in-out infinite;}
.status.off .dot{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- Итоги смены ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 16px;}
.totals{
  margin-top:16px;
  background:var(--card);border-radius:var(--r-card);
  box-shadow:var(--shadow);
  display:grid;grid-template-columns:1fr 1fr;
}
.tot{padding:16px 18px;}
.tot:nth-child(1),.tot:nth-child(2){border-bottom:.5px solid var(--sep);}
.tot:nth-child(odd){border-right:.5px solid var(--sep);}
.tot .k{font-size:13px;font-weight:510;color:var(--label-2);letter-spacing:-.008em;}
.tot .v{
  font-size:26px;font-weight:680;letter-spacing:-.03em;margin-top:3px;
  font-variant-numeric:tabular-nums;
  font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,sans-serif;
}
.tot .v small{font-size:14px;font-weight:590;color:var(--label-2);letter-spacing:-.01em;}
.tot.cash .v{color:var(--green);}
.tot.card .v{color:var(--blue);}

/* ---------- Бармен ---------- */
.section-title{
  font-size:13px;font-weight:590;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.04em;
  margin:26px 6px 9px;
}
/* ---------- Сетка коктейлей ---------- */
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px;
}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);}}
.item{
  background:var(--card);border-radius:var(--r-card);
  box-shadow:var(--shadow);
  padding:12px 12px 14px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  transition:transform .18s cubic-bezier(.32,.72,0,1), opacity .18s;
  position:relative;overflow:hidden;
}
.item:active{transform:scale(.955);}
.item .art{width:100%;height:104px;display:flex;align-items:flex-end;justify-content:center;}
.item .art svg{height:100%;width:auto;display:block;}
.item .nm{
  font-size:15px;font-weight:610;letter-spacing:-.018em;margin-top:9px;
  line-height:1.2;min-height:2.4em;display:flex;align-items:center;
}
.item .pr{
  font-size:13px;font-weight:590;color:var(--label-2);
  font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em;
}
.item .badge{
  position:absolute;top:9px;right:9px;
  min-width:22px;height:22px;padding:0 6px;border-radius:11px;
  background:var(--blue);color:#fff;font-size:12px;font-weight:680;
  display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
  transform:scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.item .badge.on{transform:scale(1);}

/* ---------- Последние продажи ---------- */
.list{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:.5px solid var(--sep);}
.row:last-child{border-bottom:none;}
.row .pay{width:9px;height:9px;border-radius:50%;flex:none;}
.row .pay.cash{background:var(--green);}
.row .pay.card{background:var(--blue);}
.row .txt{flex:1;min-width:0;}
.row .t1{font-size:15px;font-weight:530;letter-spacing:-.016em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .t2{font-size:12.5px;color:var(--label-2);margin-top:1px;letter-spacing:-.006em;}
.row .sum{font-size:15px;font-weight:590;font-variant-numeric:tabular-nums;letter-spacing:-.016em;}
.row .undo{
  font-size:13px;font-weight:590;color:var(--red);padding:6px 9px;
  border-radius:8px;background:var(--fill);margin-left:2px;
}
.row.void{opacity:.42;}
.row.void .t1{text-decoration:line-through;}
.empty{padding:26px 16px;text-align:center;color:var(--label-2);font-size:14.5px;}

/* ---------- Нижний лист ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--bg);
  border-radius:22px 22px 0 0;
  padding:8px 16px calc(16px + var(--safe-b));
  transform:translateY(102%);
  transition:transform .42s cubic-bezier(.32,.72,0,1);
  max-width:560px;margin:0 auto;
  box-shadow:0 -1px 0 var(--sep);
}
.sheet.on{transform:translateY(0);}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto 12px;}
.sheet .head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.sheet .head .art{width:56px;height:72px;flex:none;display:flex;align-items:flex-end;justify-content:center;}
.sheet .head .art svg{height:100%;width:auto;}
.sheet .head h2{margin:0;font-size:21px;font-weight:680;letter-spacing:-.026em;line-height:1.15;
  font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,sans-serif;}
.sheet .head p{margin:3px 0 0;font-size:14px;color:var(--label-2);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}

.stepper{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:12px;
}
.stepper .lbl{font-size:16px;font-weight:530;letter-spacing:-.018em;padding-left:4px;}
.stepper .ctl{display:flex;align-items:center;gap:6px;}
.stepper .ctl button{
  width:44px;height:44px;border-radius:13px;background:var(--fill);
  font-size:24px;font-weight:400;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .12s;
}
.stepper .ctl button:active{background:var(--fill-2);transform:scale(.92);}
.stepper .ctl .qty{
  min-width:52px;text-align:center;font-size:26px;font-weight:640;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,sans-serif;
}
.total-line{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:2px 6px 16px;
}
.total-line span{font-size:15px;color:var(--label-2);letter-spacing:-.016em;}
.total-line b{font-size:28px;font-weight:700;letter-spacing:-.032em;font-variant-numeric:tabular-nums;
  font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,sans-serif;}

.pay-seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.pay-seg button{
  height:60px;border-radius:15px;background:var(--card);
  font-size:16px;font-weight:610;letter-spacing:-.018em;color:var(--label);
  display:flex;align-items:center;justify-content:center;gap:9px;
  border:2px solid transparent;
  transition:border-color .18s,background .18s,transform .12s cubic-bezier(.32,.72,0,1);
}
.pay-seg button:active{transform:scale(.97);}
.pay-seg button .mark{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--label-3);flex:none;
  display:flex;align-items:center;justify-content:center;transition:border-color .18s,background .18s;
}
.pay-seg button .mark svg{width:11px;height:11px;opacity:0;transition:opacity .18s;}
.pay-seg button[aria-pressed="true"] .mark svg{opacity:1;}
.pay-seg button[data-pay="Наличные"][aria-pressed="true"]{border-color:var(--green);}
.pay-seg button[data-pay="Наличные"][aria-pressed="true"] .mark{background:var(--green);border-color:var(--green);}
.pay-seg button[data-pay="Карта"][aria-pressed="true"]{border-color:var(--blue);}
.pay-seg button[data-pay="Карта"][aria-pressed="true"] .mark{background:var(--blue);border-color:var(--blue);}

.confirm{
  width:100%;height:58px;border-radius:15px;background:var(--label);color:var(--bg);
  font-size:18px;font-weight:680;letter-spacing:-.022em;
  font-variant-numeric:tabular-nums;
  transition:transform .12s cubic-bezier(.32,.72,0,1),opacity .18s;
}
.confirm:active{transform:scale(.97);}
.confirm:disabled{opacity:.3;transform:none;}

/* ---------- Экран подтверждения ---------- */
.done{
  position:fixed;inset:0;z-index:120;
  background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .24s ease;
}
.done.on{opacity:1;pointer-events:auto;}
.done-card{text-align:center;color:#fff;padding:0 32px;transform:scale(.9);transition:transform .42s cubic-bezier(.34,1.4,.64,1);}
.done.on .done-card{transform:scale(1);}
.done svg{width:96px;height:96px;display:block;margin:0 auto 20px;}
.done .ring{fill:none;stroke:#34C759;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:283;stroke-dashoffset:283;transform:rotate(-90deg);transform-origin:50% 50%;}
.done .tick{fill:none;stroke:#34C759;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:44;stroke-dashoffset:44;}
.done.on .ring{animation:ring .55s cubic-bezier(.32,.72,0,1) forwards;}
.done.on .tick{animation:tick .3s .34s cubic-bezier(.32,.72,0,1) forwards;}
@keyframes ring{to{stroke-dashoffset:0}}
@keyframes tick{to{stroke-dashoffset:0}}
.done .d-sum{font-size:40px;font-weight:700;letter-spacing:-.036em;font-variant-numeric:tabular-nums;
  font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,sans-serif;
  opacity:0;animation:none;}
.done.on .d-sum{animation:rise .38s .42s cubic-bezier(.32,.72,0,1) forwards;}
.done .d-sub{font-size:16px;font-weight:530;color:rgba(255,255,255,.72);margin-top:7px;letter-spacing:-.016em;opacity:0;}
.done.on .d-sub{animation:rise .38s .5s cubic-bezier(.32,.72,0,1) forwards;}
.done .d-note{font-size:13.5px;font-weight:590;color:#FF9F0A;margin-top:14px;letter-spacing:-.01em;opacity:0;}
.done.on .d-note{animation:rise .38s .58s cubic-bezier(.32,.72,0,1) forwards;}
.done .d-note[hidden]{display:none;}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.cancel{
  width:100%;height:50px;margin-top:8px;border-radius:15px;
  background:var(--fill);font-size:17px;font-weight:590;letter-spacing:-.02em;color:var(--label);
}

/* ---------- Тост ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translate(-50%,20px);
  background:rgba(28,28,30,.94);color:#fff;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:11px 18px;border-radius:100px;
  font-size:15px;font-weight:590;letter-spacing:-.016em;
  z-index:90;opacity:0;pointer-events:none;
  transition:opacity .26s,transform .26s cubic-bezier(.32,.72,0,1);
  white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){.toast{background:rgba(72,72,74,.94);}}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ---------- Футер ---------- */
.banner{
  margin-top:16px;background:var(--card);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:15px 17px;
  border-left:4px solid var(--orange);
}
.banner b{display:block;font-size:15.5px;font-weight:640;letter-spacing:-.018em;}
.banner span{display:block;font-size:13.5px;color:var(--label-2);margin-top:4px;line-height:1.35;letter-spacing:-.006em;}
.banner[hidden]{display:none;}
.banner button{
  margin-top:11px;height:38px;padding:0 16px;border-radius:11px;
  background:var(--blue);color:#fff;font-size:15px;font-weight:610;letter-spacing:-.016em;
}
.banner button:active{filter:brightness(.9);}

.foot{display:flex;gap:10px;margin-top:14px;}
.foot button{
  flex:1;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);
  font-size:15px;font-weight:590;letter-spacing:-.016em;color:var(--blue);
}
.foot button.danger{color:var(--red);}
.foot button[hidden]{display:none;}
.foot button .cnt{
  display:inline-block;margin-left:6px;min-width:20px;padding:0 6px;height:19px;line-height:19px;
  border-radius:10px;background:var(--orange);color:#fff;font-size:12px;font-weight:680;
  font-variant-numeric:tabular-nums;vertical-align:1px;
}
.foot button .cnt[hidden]{display:none;}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="topbar">
  <h1>Teplo Drinks</h1>
  <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Готово</span></div>
</div>

<div class="wrap">

  <div class="totals">
    <div class="tot"><div class="k">Выручка</div><div class="v" id="tRev">0<small> сум</small></div></div>
    <div class="tot"><div class="k">Продано</div><div class="v" id="tQty">0<small> шт</small></div></div>
    <div class="tot cash"><div class="k">Наличные</div><div class="v" id="tCash">0<small> сум</small></div></div>
    <div class="tot card"><div class="k">Карта</div><div class="v" id="tCard">0<small> сум</small></div></div>
  </div>

  <div class="section-title">Меню</div>
  <div class="grid" id="grid"></div>

  <div class="banner" id="banner" hidden>
    <b>Отчёт не подключён</b>
    <span>Продажи сохраняются на устройстве и не теряются. Подключите отчёт — очередь уйдёт целиком одним нажатием.</span>
    <button id="btnConnect">Подключить отчёт</button>
  </div>

  <div class="section-title">Последние продажи</div>
  <div class="list" id="list"><div class="empty">Продаж пока нет</div></div>

  <div class="foot">
    <button id="btnSync" hidden>Отправить<span class="cnt" id="syncCnt" hidden>0</span></button>
    <button class="danger" id="btnReset">Закрыть смену</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grabber"></div>
  <div class="head">
    <div class="art" id="shArt"></div>
    <div>
      <h2 id="shName">—</h2>
      <p id="shPrice">—</p>
    </div>
  </div>
  <div class="stepper">
    <div class="lbl">Количество</div>
    <div class="ctl">
      <button id="minus" aria-label="Минус">−</button>
      <div class="qty" id="qty">1</div>
      <button id="plus" aria-label="Плюс">+</button>
    </div>
  </div>
  <div class="total-line"><span>К оплате</span><b id="shTotal">0</b></div>
  <div class="pay-seg" id="paySeg">
    <button data-pay="Наличные" aria-pressed="false">
      <span class="mark"><svg viewBox="0 0 12 12"><path d="M1.5 6.4 L4.4 9.2 L10.5 2.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Наличные
    </button>
    <button data-pay="Карта" aria-pressed="false">
      <span class="mark"><svg viewBox="0 0 12 12"><path d="M1.5 6.4 L4.4 9.2 L10.5 2.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Карта
    </button>
  </div>
  <button class="confirm" id="confirm" disabled>Выберите способ оплаты</button>
  <button class="cancel" id="closeSheet">Отмена</button>
</div>

<div class="done" id="done">
  <div class="done-card">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle class="ring" cx="50" cy="50" r="45"/>
      <path class="tick" d="M30 51 L44 65 L71 36"/>
    </svg>
    <div class="d-sum" id="dSum">0</div>
    <div class="d-sub" id="dSub">—</div>
    <div class="d-note" id="dNote" hidden>Не подтверждено отчётом</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   1. НАСТРОЙКА
   ========================================================== */
/* Ссылку можно НЕ вписывать сюда — см. README.
   Три источника, по приоритету:
     1) адрес вида  index.html#url=https://script.google.com/.../exec
     2) сохранённая ранее ссылка на этом устройстве
     3) константа ниже (нужна, только если репозиторий приватный)      */
let SCRIPT_URL = "";

/* ==========================================================
   2. МЕНЮ
   ========================================================== */
const MENU = [
  {id:"mojito",  name:"Мохито",              price:80000, art:"highball", liquid:"#BFE3A8", garnish:"mint"},
  {id:"aperol",  name:"Aperol Spritz",       price:80000, art:"wine",     liquid:"#FF7A2F", garnish:"orange"},
  {id:"mule",    name:"Московский мул",      price:80000, art:"mug",      liquid:"#C97B4A", garnish:"lime"},
  {id:"negroni", name:"Негрони",             price:80000, art:"rocks",    liquid:"#B3301F", garnish:"peel"},
  {id:"gt",      name:"Джин-тоник",          price:80000, art:"highball", liquid:"#DCEEF6", garnish:"lime"},
  {id:"gtcuc",   name:"Джин-тоник огуречный",price:80000, art:"highball", liquid:"#D3E9C6", garnish:"cucumber"},
  {id:"sour",    name:"Виски сауэр",         price:80000, art:"rocks",    liquid:"#DE9C36", garnish:"foam"},
  {id:"beer",    name:"Пиво б/а",            price:80000, art:"beer",     liquid:"#F0B429", garnish:"foam"},
  {id:"white",   name:"Вино белое",          price:50000, art:"wine",     liquid:"#EFE0A0", garnish:"none"},
  {id:"red",     name:"Вино красное",        price:50000, art:"wine",     liquid:"#7E1F2E", garnish:"none"}
];

/* ==========================================================
   3. Иллюстрации — единая рисованная серия (SVG)
   ========================================================== */
const S = 'stroke="var(--label)" stroke-opacity=".55" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"';

/* ==========================================================
   4. Состояние
   ========================================================== */
const fmt = n => n.toLocaleString("ru-RU").replace(/\u00A0/g," ");
let sales = [];           // {id, ts, drink, qty, price, sum, pay, void, synced}
let queue = [];           // ожидают отправки
let current = null, qty = 1, payMode = null, sending = false, backoff = 0, unconfirmedSeen = false;

/* --- подключение отчёта: hash → память устройства → константа --- */
function resolveUrl(){
  let u = "";
  try{
    const m = (location.hash||"").match(/url=([^&]+)/);
    if(m){ u = decodeURIComponent(m[1]); localStorage.setItem("bar_url", u);
           history.replaceState(null,"",location.pathname+location.search); }
    if(!u) u = localStorage.getItem("bar_url") || "";
  }catch(e){}
  if(u) SCRIPT_URL = u;
}


function connectUrl(){
  const u = prompt("Вставьте ссылку веб-приложения Apps Script (заканчивается на /exec):", SCRIPT_URL||"https://script.google.com/macros/s/.../exec");
  if(!u) return;
  const v = u.trim();
  if(v.indexOf("script.google.com") === -1 || v.slice(-5) !== "/exec"){
    alert("Ссылка должна быть с script.google.com и заканчиваться на /exec.\n\nЕсли она заканчивается на /dev — это тестовый адрес, он требует входа в аккаунт и работать не будет."); return;
  }
  SCRIPT_URL = v;
  try{ localStorage.setItem("bar_url", v); }catch(e){}
  $("#banner").hidden = true;
  backoff = 0;
  toast("Проверяю связь…");
  ping().then(ok=>{
    toast(ok ? "Отчёт подключён" : "Адрес принят, но отчёт не отвечает — проверьте доступ «Все»");
    flush();
  });
}

/* --- необязательное локальное сохранение (не мешает работе, если недоступно) --- */
const store = {
  save(){ try{ localStorage.setItem("bar_v1", JSON.stringify({sales,queue})); }catch(e){} },
  load(){ try{ const d=JSON.parse(localStorage.getItem("bar_v1")||"null");
    if(d){ sales=d.sales||[]; queue=d.queue||[]; } }catch(e){} }
};

/* ==========================================================
   5. Рендер
   ========================================================== */
const $ = s => document.querySelector(s);
const grid = $("#grid");

function renderMenu(){
  grid.innerHTML = MENU.map(d=>`
    <button class="item" data-id="${d.id}">
      <span class="badge" id="bg-${d.id}">0</span>
      <div class="art">${art(d)}</div>
      <div class="nm">${d.name}</div>
      <div class="pr">${fmt(d.price)} сум</div>
    </button>`).join("");
  grid.querySelectorAll(".item").forEach(el=>{
    el.addEventListener("click",()=>openSheet(el.dataset.id));
  });
}



function renderTotals(){
  const live = sales.filter(s=>!s.void);
  const rev = live.reduce((a,s)=>a+s.sum,0);
  const q   = live.reduce((a,s)=>a+s.qty,0);
  const cash= live.filter(s=>s.pay==="Наличные").reduce((a,s)=>a+s.sum,0);
  const card= live.filter(s=>s.pay==="Карта").reduce((a,s)=>a+s.sum,0);
  $("#tRev").innerHTML  = fmt(rev)+"<small> сум</small>";
  $("#tQty").innerHTML  = fmt(q)+"<small> шт</small>";
  $("#tCash").innerHTML = fmt(cash)+"<small> сум</small>";
  $("#tCard").innerHTML = fmt(card)+"<small> сум</small>";
  MENU.forEach(d=>{
    const n = live.filter(s=>s.drink===d.name).reduce((a,s)=>a+s.qty,0);
    const b = document.getElementById("bg-"+d.id);
    if(b){ b.textContent=n; b.classList.toggle("on", n>0); }
  });
}

function renderList(){
  const l = $("#list");
  if(!sales.length){ l.innerHTML='<div class="empty">Продаж пока нет</div>'; return; }
  l.innerHTML = sales.slice(0,8).map(s=>`
    <div class="row ${s.void?"void":""}">
      <span class="pay ${s.pay==="Наличные"?"cash":"card"}"></span>
      <div class="txt">
        <div class="t1">${s.drink} × ${s.qty}</div>
        <div class="t2">${s.time} · ${s.pay}${s.synced?(s.unconfirmed?" · без подтверждения":""):" · ожидает"}</div>
      </div>
      <div class="sum">${fmt(s.sum)}</div>
      ${s.void?"":`<button class="undo" data-void="${s.id}">Отменить</button>`}
    </div>`).join("");
  l.querySelectorAll("[data-void]").forEach(b=>b.addEventListener("click",()=>voidSale(b.dataset.void)));
}

function render(){ renderTotals(); renderList(); store.save(); }

/* ==========================================================
   6. Нижний лист
   ========================================================== */
function openSheet(id){
  current = MENU.find(d=>d.id===id); qty = 1; payMode = null;
  document.querySelectorAll("#paySeg button").forEach(b=>b.setAttribute("aria-pressed","false"));
  $("#shArt").innerHTML = art(current);
  $("#shName").textContent = current.name;
  $("#shPrice").textContent = fmt(current.price)+" сум за порцию";
  updSheet();
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  haptic();
}
function closeSheet(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
function updSheet(){
  $("#qty").textContent = qty;
  $("#shTotal").textContent = fmt(current.price*qty);
  const c = $("#confirm");
  c.disabled = !payMode;
  c.textContent = payMode ? `Оплатить · ${fmt(current.price*qty)}` : "Выберите способ оплаты";
}

$("#plus").addEventListener("click",()=>{ if(qty<50){qty++;updSheet();haptic();} });
$("#minus").addEventListener("click",()=>{ if(qty>1){qty--;updSheet();haptic();} });
$("#closeSheet").addEventListener("click",closeSheet);
$("#scrim").addEventListener("click",closeSheet);
document.querySelectorAll("#paySeg button").forEach(b=>{
  b.addEventListener("click",()=>{
    payMode = b.dataset.pay;
    document.querySelectorAll("#paySeg button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    updSheet(); haptic();
  });
});
$("#confirm").addEventListener("click",()=>{ if(payMode) commit(payMode); });

function showDone(s){
  $("#dSum").textContent = fmt(s.sum) + " сум";
  $("#dSub").textContent = `${s.drink} × ${s.qty} · ${s.pay}`;
  $("#dNote").hidden = true;
  const el = $("#done");
  el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  clearTimeout(el._h);
  el._h = setTimeout(()=>el.classList.remove("on"), 2000);
  el.onclick = ()=>{ clearTimeout(el._h); el.classList.remove("on"); };
}

/* ==========================================================
   7. Продажа / отмена
   ========================================================== */
function nowParts(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return {
    date: `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`,
    time: `${p(d.getHours())}:${p(d.getMinutes())}`,
    iso : d.toISOString()
  };
}

function commit(pay){
  if(!current) return;
  const t = nowParts();
  const s = {
    id: t.iso.replace(/\D/g,"")+"-"+Math.random().toString(36).slice(2,7),
    date:t.date, time:t.time, iso:t.iso,
    drink:current.name, qty,
    price:current.price, sum:current.price*qty,
    pay, type:"Продажа", void:false, synced:false
  };
  sales.unshift(s); queue.push(s);
  closeSheet(); showDone(s); render(); flush();
  haptic(true);
}

function voidSale(id){
  const s = sales.find(x=>x.id===id);
  if(!s || s.void) return;
  if(!confirm(`Отменить: ${s.drink} × ${s.qty} на ${fmt(s.sum)} сум?`)) return;
  s.void = true;
  const t = nowParts();
  queue.push({...s, id:s.id+"-void", date:t.date, time:t.time, iso:t.iso,
              qty:-s.qty, sum:-s.sum, type:"Отмена", synced:false});
  render(); flush(); toast("Продажа отменена");
}

/* ==========================================================
   8. Отправка в отчёт  (без CORS — через JSONP + sendBeacon)
   ========================================================== */
function setStatus(cls, txt){
  const el = $("#status"); el.className = "status"+(cls?" "+cls:""); $("#statusTxt").textContent = txt;
  const c = $("#syncCnt");
  if(c){ c.textContent = queue.length; c.hidden = !queue.length; }
  const b = $("#btnSync");
  if(b) b.hidden = !(queue.length || !SCRIPT_URL);
}

/* Отправка одной записи. Никогда не блокирует интерфейс. */
function send(item){
  return new Promise(resolve=>{
    if(!SCRIPT_URL) return resolve("failed");
    const cb  = "cb"+Math.random().toString(36).slice(2,9);
    const url = SCRIPT_URL + (SCRIPT_URL.indexOf("?")>-1?"&":"?")
              + "callback=" + cb + "&d=" + encodeURIComponent(JSON.stringify(item));
    const tag = document.createElement("script");
    let done = false;
    const finish = ok => {
      if(done) return; done = true;
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(tag.parentNode) tag.parentNode.removeChild(tag);
      resolve(ok);
    };
    window[cb] = r => finish((r && r.ok) ? "confirmed" : "failed");
    tag.onerror = () => finish(beacon(item) ? "unconfirmed" : "failed");
    const timer = setTimeout(()=>finish(beacon(item) ? "unconfirmed" : "failed"), 9000);
    tag.src = url;
    document.head.appendChild(tag);
  });
}

/* Резервный канал: уходит даже при закрытии вкладки */
function beacon(item){
  try{
    if(navigator.sendBeacon){
      return navigator.sendBeacon(SCRIPT_URL,
        new Blob([JSON.stringify({items:[item]})], {type:"text/plain;charset=UTF-8"}));
    }
  }catch(e){}
  return false;
}

/* Реальная проверка связи с отчётом */
function ping(){
  return new Promise(resolve=>{
    if(!SCRIPT_URL) return resolve(false);
    const cb = "pg"+Math.random().toString(36).slice(2,9);
    const tag = document.createElement("script");
    let done = false;
    const fin = v => {
      if(done) return; done = true; clearTimeout(tm);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(tag.parentNode) tag.parentNode.removeChild(tag);
      resolve(v);
    };
    window[cb] = r => fin(!!(r && r.ok));
    tag.onerror = () => fin(false);
    const tm = setTimeout(()=>fin(false), 9000);
    tag.src = SCRIPT_URL + (SCRIPT_URL.indexOf("?")>-1?"&":"?") + "callback=" + cb;
    document.head.appendChild(tag);
  });
}

let retryTimer = null;
function scheduleRetry(){
  backoff = backoff ? Math.min(backoff*2, 30000) : 3000;
  clearTimeout(retryTimer);
  retryTimer = setTimeout(()=>{ flush(); }, backoff);
}

async function flush(){
  if(sending) return;
  if(!SCRIPT_URL){ setStatus("pending","Не подключено"); return; }
  if(!queue.length){ setStatus("","Синхронизировано"); return; }
  if(navigator.onLine === false){ setStatus("off",`Нет сети · ${queue.length}`); return; }

  sending = true;
  try{
    while(queue.length){
      setStatus("pending", `Отправка · ${queue.length}`);
      const item = queue[0];
      const res = await send(item);
      if(res === "failed"){ scheduleRetry(); setStatus("off", `Повтор · ${queue.length}`); break; }
      backoff = 0;
      queue.shift();
      const s = sales.find(x=>x.id===item.id);
      if(s){ s.synced = true; s.unconfirmed = (res === "unconfirmed"); }
      if(res === "unconfirmed") unconfirmedSeen = true;
      render();
    }
    if(!queue.length){ backoff = 0; setStatus("", unconfirmedSeen ? "Без подтверждения" : "Синхронизировано"); }
  }finally{
    sending = false;
  }
}

setInterval(()=>{ if(queue.length && !sending) flush(); }, 20000);
window.addEventListener("online", ()=>{ backoff=0; flush(); });
window.addEventListener("offline", ()=>setStatus("off", `Нет сети · ${queue.length}`));

/* ==========================================================
   9. Прочее
   ========================================================== */
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 1700);
}
function haptic(strong){ try{ navigator.vibrate && navigator.vibrate(strong?[8,30,8]:6); }catch(e){} }

$("#btnSync").addEventListener("click",()=>{
  backoff = 0; clearTimeout(retryTimer);
  if(!SCRIPT_URL){ connectUrl(); return; }
  toast(queue.length ? `Отправка · ${queue.length}` : "Всё уже в отчёте");
  flush();
});
$("#btnReset").addEventListener("click",()=>{
  const live = sales.filter(s=>!s.void);
  const rev  = live.reduce((a,s)=>a+s.sum,0);
  const cash = live.filter(s=>s.pay==="Наличные").reduce((a,s)=>a+s.sum,0);
  const card = live.filter(s=>s.pay==="Карта").reduce((a,s)=>a+s.sum,0);
  const q    = live.reduce((a,s)=>a+s.qty,0);
  if(queue.length && !confirm(`${queue.length} записей ещё не в отчёте. Всё равно закрыть смену?`)) return;
  if(!confirm(
    `Итог смены\n\n`+
    `Выручка: ${fmt(rev)} сум\n`+
    `Наличные: ${fmt(cash)} сум\n`+
    `Карта: ${fmt(card)} сум\n`+
    `Продано: ${fmt(q)} шт\n\n`+
    `Экран очистится. Данные в отчёте останутся.`)) return;
  sales=[]; queue=[]; backoff=0; clearTimeout(retryTimer);
  render(); setStatus(SCRIPT_URL?"":"pending", SCRIPT_URL?"Синхронизировано":"Не подключено");
  toast("Смена закрыта");
});

window.addEventListener("beforeunload", e=>{ if(queue.length){ e.preventDefault(); e.returnValue=""; } });

resolveUrl(); store.load(); renderMenu(); render();
$("#btnConnect").addEventListener("click", connectUrl);
$("#status").addEventListener("click", async ()=>{
  if(!SCRIPT_URL){ connectUrl(); return; }
  toast("Проверяю связь…");
  const ok = await ping();
  if(ok){ unconfirmedSeen = false; toast("Отчёт отвечает"); backoff = 0; flush(); }
  else   { toast("Отчёт не отвечает — проверьте доступ «Все»"); }
});
$("#banner").hidden = !!SCRIPT_URL;
setStatus(SCRIPT_URL?"":"pending", SCRIPT_URL?(queue.length?`Отправка · ${queue.length}`:"Синхронизировано"):"Не подключено");
if(queue.length) flush();
</script>
